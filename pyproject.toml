[project]
name = "financial-impulse"
version = "0.1.0"
description = "Market 'gravity': level-indexed fields estimated from OHLCV bars, with out-of-sample passage tests."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
    "pyarrow>=14",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
